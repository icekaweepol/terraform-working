controller:
  name: controller
  image:
    registry: harbor.scb.co.th
    image: facility/registry.k8s.io/ingress-nginx/controller
    tag: "v1.14.2"
    digest: sha256:df929a35d8cf1a376cbdfd6391b741e980adf3f2d7457223315160c3786c00b7

  containerPort:
    https: 443

  config:
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "EECDH+AESGCM:EDH+AESGCM"
    hsts-preload: "true"
    ssl-session-tickets: "false"
    server-tokens: "false"
    use-forwarded-headers: "true"
    large-client-header-buffers: "4 16k"
    enable-underscores-in-headers: "true"
    allow-snippet-annotations: "true"
    annotations-risk-level: Critical
    real-ip-header: proxy_protocol

  extraArgs:
    default-ssl-certificate: "ingress-nginx/scb-tls-cert"

  extraEnvs:
  - name: TZ
    value: Asia/Bangkok

  kind: DaemonSet

  nodeSelector:
    role: infra

  service:
    # externalTrafficPolicy: "Local"
    enableHttp: false
    targetPorts:
      https: https

    annotations:
      {
        "external-dns.alpha.kubernetes.io/hostname": "nginx-ingress-prod-pci-2.prod-pci-vpc-2.cloud.scb53",
        "service.beta.kubernetes.io/aws-load-balancer-type": "nlb",
        "service.beta.kubernetes.io/aws-load-balancer-internal": "true",
        "service.beta.kubernetes.io/aws-load-balancer-backend-protocol": "tcp",
        "service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled": "true",
        #  "service.beta.kubernetes.io/aws-load-balancer-access-log-enabled": "true",
      #  "service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-name": "ingress-accesslog-prodpci-k8s",
      #  "service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-prefix": "SCB-PROD-PCI-2-EKS/ingress-nginx",
        "service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags": "Name=nlb-nginx-ingress-PROD-PCI-2-Centralized-EKS,AppName=Centralized EKS,Environment=prod,Company=scb,AppLevel=0,AppType=prod,AdminName=suttipot.eksakulkla@scb.co.th,AdminName2=yothin.rodkaeo@scb.co.th,Provisioner=helm,AppModule=Kubernetes Cluster,Function=Loadbalancer,Inuse=yes"
      }

    type: LoadBalancer

    loadBalancerSourceRanges:
    - 10.0.0.0/8

  admissionWebhooks:
    enabled: false

defaultBackend:
  enabled: true

  name: defaultbackend
  image:
    registry: harbor.scb.co.th
    image: facility/k8s.gcr.io/defaultbackend-amd64
    tag: "1.5"

  resources:
    limits:
      cpu: 10m
      memory: 20Mi
    requests:
      cpu: 10m
      memory: 20Mi

  nodeSelector:
    role: infra

rbac:
  create: true
  scope: false

podSecurityPolicy:
  enabled: false

serviceAccount:
  create: true
  name:


